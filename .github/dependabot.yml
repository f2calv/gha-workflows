version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: nuget
    directories:
      - /
      - /tests/fixtures/dotnet
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: docker
    directory: /tests/fixtures/container
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: cargo
    directory: /tests/fixtures/rust
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: uv
    directory: /tests/fixtures/python
    schedule:
      interval: weekly
      time: "04:00"
