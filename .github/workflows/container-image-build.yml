name: _container-image-build
#Note: this uses buildx for multiarchitecture builds, maybe make an opt-out for this in the future?

on:
  workflow_call:
    inputs:
      registry:
        type: string
        description: e.g. ghcr.io/gh-user, xyz.azurecr.io or docker.io
        required: true
      repository:
        type: string
        description: If empty the repository will derive from name of the repo, e.g. gh-user/my-repo-name
        default: ''
      repository-prefix:
        type: string
        description: e.g. prefix/
        default: ''
      dockerfile:
        type: string
        description: Location of the Dockerfile in the local repository you wish to build.
        default: Dockerfile
      tag:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12
        required: true
      default-branch-tag:
        type: string
        description: Default branch tag, e.g. latest
        default: latest
      feature-branch-tag:
        type: string
        description: Feature branch tag, e.g. latest-dev
        default: latest-dev
      platform:
        type: string
        description: Specify the target platform for the build output, e.g. linux/amd64,linux/arm64,linux/arm/v7
        default: linux/amd64,linux/arm64,linux/arm/v7
      args:
        type: string
        description: Used to pass optional build arguments.
        default: ''
      default-branch:
        type: string
        description: Workflow behaves differently on the default branch.
        default: refs/heads/main
      push-image:
        type: boolean
        description: By default always push the newly built container image.
        default: true
      github-private-packages-auth:
        type: boolean
        description: Set to true when you want to access private nuget packages in a private github packages feed.
        default: false
      extra-repos:
        type: string
        description: >
          JSON array of extra repositories to clone into the Docker build context.
          Each element: {"repo":"owner/name","ref":"main","path":"deps/name"}
        default: '[]'
      #Runs against the loaded image before the multi-architecture build, which is the only point the
      #image exists locally; a multi-platform result cannot be loaded into the docker image store.
      #The image reference is exported as IMAGE. Empty skips the test entirely.
      smoke-test:
        type: string
        description: Shell commands run against the built image e.g. docker run --rm $IMAGE --version
        default: ''
      #Must be a single platform, and normally the runner's own, or the image cannot execute.
      smoke-test-platform:
        type: string
        description: Platform the smoke test image is built for e.g. linux/amd64
        default: linux/amd64

jobs:
  container-image-build:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    #https://github.blog/changelog/2021-04-20-github-actions-control-permissions-for-github_token/
    #https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: clone extra repositories
        if: inputs.extra-repos != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_REPOS: ${{ inputs.extra-repos }}
        run: |
          echo "$EXTRA_REPOS" | jq -c '.[]' | while read -r item; do
            REPO=$(echo "$item" | jq -r '.repo')
            REF=$(echo "$item" | jq -r '.ref // "HEAD"')
            DEST=$(echo "$item" | jq -r '.path // "deps"')
            echo "Cloning $REPO@$REF into $DEST"
            git clone --depth 1 --branch "$REF" \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$DEST"
          done

      - name: github private packages auth
        if: inputs.github-private-packages-auth == true
        run: |
          dotnet nuget remove source github
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.actor }}/index.json" --configfile NuGet.config

      - name: set vars
        id: setupvars
        run: |
          REPOSITORY=${{ inputs.repository }}

          if [[ -z "$REPOSITORY" ]]; then
            #set the repository to the current gh repository, then strip the repository_owner away
            REPOSITORY=${{ github.repository }}
            REPOSITORY=$(echo $REPOSITORY | sed "s|${{ github.repository_owner }}\/||g")
          fi
          #lowercase
          REPOSITORY=${REPOSITORY,,}
          IMAGE_NAME=${REPOSITORY,,}

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "REPOSITORY=${{ inputs.repository-prefix }}$REPOSITORY" >> $GITHUB_ENV

          TAG=${{ inputs.tag }}
          TAG=${TAG,,}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "REGISTRY=${{ inputs.registry }}" >> $GITHUB_ENV

      - name: docker login ${{ inputs.registry }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: docker buildx build/push
        id: build
        run: |
          docker buildx create --name multiarchtest --use

          #every build shares these, and the smoke test image must match what is published
          build() {
            docker buildx build \
              -f "${{ inputs.dockerfile }}" \
              --label "GITHUB_RUN_ID=${{ github.run_id }}" \
              --label "IMAGE_NAME=$IMAGE_NAME" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --build-arg GIT_REPOSITORY=${{ github.repository }} \
              --build-arg GIT_BRANCH=${{ github.ref }} \
              --build-arg GIT_COMMIT=${{ github.sha }} \
              --build-arg GIT_TAG=$TAG \
              --build-arg GITHUB_WORKFLOW="${{ github.workflow }}" \
              --build-arg GITHUB_RUN_ID=${{ github.run_id }} \
              --build-arg GITHUB_RUN_NUMBER=${{ github.run_number }} \
              --pull \
              "$@" \
              .
          }

          TAGS=()
          TAGS+=(-t "$REGISTRY/$REPOSITORY:$TAG")
          if [[ "${{ github.ref }}" == "${{ inputs.default-branch }}" ]]; then
            ADDITIONAL_TAG=${{ inputs.default-branch-tag }}
          else
            ADDITIONAL_TAG=${{ inputs.feature-branch-tag }}
          fi
          ADDITIONAL_TAG=${ADDITIONAL_TAG,,}
          TAGS+=(-t "$REGISTRY/$REPOSITORY:$ADDITIONAL_TAG")

          ARGS=()
          if [[ "${{ inputs.push-image }}" == "true" ]]; then
            ARGS+=(--push)
          fi
          if [[ ! -z "${{ inputs.args }}" ]]; then
            ARGS+=(${{ inputs.args }})
          fi

          echo "REGISTRY=$REGISTRY"
          echo "REPOSITORY=$REPOSITORY"
          echo "TAG=$TAG"
          echo "TAGS=${TAGS[@]}"
          echo "args=${{ inputs.args }}"
          echo "ARGS=${ARGS[@]}"
          echo "DockerFile=${{ inputs.dockerfile }}"

          if [[ -n "$SMOKE_TEST" ]]; then
            IMAGE="$IMAGE_NAME:smoke-test"

            echo "::group::docker buildx build --load --platform ${{ inputs.smoke-test-platform }}"
            build --load --platform ${{ inputs.smoke-test-platform }} -t "$IMAGE"
            echo "::endgroup::"

            echo "::group::smoke test"
            IMAGE="$IMAGE" bash -euo pipefail -c "$SMOKE_TEST"
            echo "::endgroup::"
          fi

          #reuses the builder above, so the smoke test platform is already cached rather than rebuilt
          build "${TAGS[@]}" --platform ${{ inputs.platform }} "${ARGS[@]}"
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1 #Note: fixes publishing container architecture 'unknown/unknown'
          SMOKE_TEST: ${{ inputs.smoke-test }}
