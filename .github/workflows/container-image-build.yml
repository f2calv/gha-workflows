name: _container-image-build

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-26.04-arm to build arm64 natively instead of under QEMU.
        default: ubuntu-26.04
      registry:
        type: string
        description: e.g. ghcr.io/gh-user, xyz.azurecr.io or docker.io
        required: true
      repository:
        type: string
        description: If empty the repository will derive from name of the repo, e.g. gh-user/my-repo-name
        default: ''
      repository-prefix:
        type: string
        description: e.g. prefix/
        default: ''
      dockerfile:
        type: string
        description: Location of the Dockerfile in the local repository you wish to build.
        default: Dockerfile
      tag:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12
        required: true
      default-branch-tag:
        type: string
        description: Default branch tag, e.g. latest
        default: latest
      feature-branch-tag:
        type: string
        description: Feature branch tag, e.g. latest-dev
        default: latest-dev
      platform:
        type: string
        description: Specify the target platform for the build output, e.g. linux/amd64,linux/arm64,linux/arm/v7
        default: linux/amd64,linux/arm64,linux/arm/v7
      platform-runners:
        type: string
        description: JSON platform/runner mappings for parallel native builds e.g. [{"platform":"linux/arm64","runner":"ubuntu-26.04-arm"}]
        default: ''
      artifact-name:
        type: string
        description: Unique artifact prefix for this workflow call e.g. container-aot
        default: container-image
      args:
        type: string
        description: Used to pass optional build arguments.
        default: ''
      default-branch:
        type: string
        description: Workflow behaves differently on the default branch.
        default: refs/heads/main
      push-image:
        type: boolean
        description: By default always push the newly built container image.
        default: true
      #Publishes SLSA provenance and an SBOM alongside the image. Opt-in, because attestations are
      #stored as extra manifests which ghcr.io and Docker Hub render as unknown/unknown platform
      #entries. Only applied to the pushed build; the docker exporter used by the smoke test cannot
      #carry attestations.
      attestations:
        type: boolean
        description: Attach SLSA provenance and SBOM attestations to the pushed image.
        default: false
      github-private-packages-auth:
        type: boolean
        description: Set to true when you want to access private nuget packages in a private github packages feed.
        default: false
      extra-repos:
        type: string
        description: >
          JSON array of extra repositories to clone into the Docker build context.
          Each element: {"repo":"owner/name","ref":"main","path":"deps/name"}
        default: '[]'
      #Shares layers between runs through the repository's Actions cache, scoped per image repository.
      #The cache is limited per repository and evicted least-recently-used, so opt in deliberately.
      buildkit-cache:
        type: boolean
        description: Cache BuildKit layers in the GitHub Actions cache.
        default: false
      #Runs against the loaded image before the multi-architecture build, which is the only point the
      #image exists locally; a multi-platform result cannot be loaded into the docker image store.
      #The image reference is exported as IMAGE. Empty skips the test entirely.
      smoke-test:
        type: string
        description: Shell commands run against the built image e.g. docker run --rm $IMAGE --version
        default: ''
      #Must be a single platform, and normally the runner's own, or the image cannot execute.
      smoke-test-platform:
        type: string
        description: Platform the smoke test image is built for e.g. linux/amd64
        default: linux/amd64

permissions: {}

jobs:
  prepare:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: validate platform runner mapping
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
          PLATFORM_RUNNERS: ${{ inputs.platform-runners }}
          DEFAULT_RUNNER: ${{ inputs.runs-on }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PLATFORM" =~ ^[a-z0-9/._-]+(,[a-z0-9/._-]+)*$ ]]
          if [[ -z "$PLATFORM_RUNNERS" ]]; then
            MATRIX=$(jq -cn --arg platform "$PLATFORM" --arg runner "$DEFAULT_RUNNER" \
              '{include: [{platform: $platform, runner: $runner, key: "single"}]}')
          else
            MATRIX=$(jq -ce --arg platforms "$PLATFORM" '
              if type != "array" or length == 0 then error("Expected a non-empty platform/runner array") else . end |
              if all(.[];
                (.platform | type == "string" and test("^linux/(amd64|arm64|arm/v7)$")) and
                (.runner | (type == "string" and length > 0) or
                  (type == "array" and length > 0 and all(.[]; type == "string" and length > 0))))
              then . else error("Invalid platform or runner") end |
              if ([.[].platform] | sort) == ($platforms | split(",") | sort) and
                ([.[].platform] | unique | length) == length
              then . else error("Runner mapping must cover each requested platform exactly once") end |
              {include: map(. + {key: (.platform | gsub("/"; "-"))})}
            ' <<< "$PLATFORM_RUNNERS")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  container-image-build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    #Inputs are free text, so scripts only ever read them as quoted environment variables. Values the
    #set vars step normalises arrive as IN_*, because job env would override a same-named GITHUB_ENV value.
    env:
      IN_REGISTRY: ${{ inputs.registry }}
      IN_REPOSITORY: ${{ inputs.repository }}
      IN_REPOSITORY_PREFIX: ${{ inputs.repository-prefix }}
      IN_TAG: ${{ inputs.tag }}
      IN_DEFAULT_BRANCH_TAG: ${{ inputs.default-branch-tag }}
      IN_FEATURE_BRANCH_TAG: ${{ inputs.feature-branch-tag }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      PLATFORM: ${{ matrix.platform }}
      BUILD_ARGS: ${{ inputs.args }}
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
      PUSH_IMAGE: ${{ inputs.push-image && github.actor != 'dependabot[bot]' }}
      ATTESTATIONS: ${{ inputs.attestations }}
      SMOKE_TEST: ${{ inputs.smoke-test }}
      SMOKE_TEST_PLATFORM: ${{ inputs.platform-runners != '' && matrix.platform || inputs.smoke-test-platform }}
      BUILDKIT_CACHE: ${{ inputs.buildkit-cache }}
      NATIVE_BUILD: ${{ inputs.platform-runners != '' }}
      PLATFORM_KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify native Docker platform (${{ matrix.platform }})
        if: inputs.platform-runners != ''
        run: |
          set -euo pipefail
          HOST_PLATFORM=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          case "$HOST_PLATFORM" in
            linux/arm) HOST_PLATFORM=linux/arm/v7 ;;
          esac
          if [[ "$HOST_PLATFORM" != "$PLATFORM" ]]; then
            echo "::error::Docker platform $HOST_PLATFORM does not match native target $PLATFORM"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
        if: inputs.platform-runners == '' && (contains(inputs.platform, ',') || inputs.platform != 'linux/amd64' || inputs.smoke-test-platform != 'linux/amd64' || runner.arch != 'X64')

      - uses: docker/setup-buildx-action@v4

      - name: clone extra repositories
        if: inputs.extra-repos != '[]'
        uses: f2calv/gha-workflows/.github/actions/clone-extra-repos@v1
        with:
          repos: ${{ inputs.extra-repos }}

      - name: github private packages auth
        if: inputs.github-private-packages-auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget remove source github
          dotnet nuget add source --username "$GITHUB_ACTOR" --password "$GH_TOKEN" --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/$GITHUB_ACTOR/index.json" --configfile NuGet.config

      - name: set vars
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          require() { [[ "$2" =~ $3 ]] || fail "$1 '$2' is invalid."; }

          REPOSITORY="$IN_REPOSITORY"
          if [[ -z "$REPOSITORY" ]]; then
            #The current repository name without its owner.
            REPOSITORY="${GITHUB_REPOSITORY#"$GITHUB_REPOSITORY_OWNER"/}"
          fi
          IMAGE_NAME=${REPOSITORY,,}
          REPOSITORY="${IN_REPOSITORY_PREFIX,,}${REPOSITORY,,}"
          REGISTRY=${IN_REGISTRY,,}
          TAG=${IN_TAG,,}
          if [[ "$GITHUB_REF" == "$DEFAULT_BRANCH" ]]; then
            ADDITIONAL_TAG=${IN_DEFAULT_BRANCH_TAG,,}
          else
            ADDITIONAL_TAG=${IN_FEATURE_BRANCH_TAG,,}
          fi

          OCI_PATTERN='^[a-z0-9][a-z0-9._:/-]*$'
          TAG_PATTERN='^[a-z0-9_][a-z0-9_.+-]*$'
          require registry "$REGISTRY" "$OCI_PATTERN"
          require repository "$REPOSITORY" "$OCI_PATTERN"
          require tag "$TAG" "$TAG_PATTERN"
          require "branch alias tag" "$ADDITIONAL_TAG" "$TAG_PATTERN"
          require dockerfile "$DOCKERFILE" '^[A-Za-z0-9._/-]+$'
          require platform "$PLATFORM" '^[a-z0-9/,._-]+$'
          require smoke-test-platform "$SMOKE_TEST_PLATFORM" '^[a-z0-9/._-]+$'

          {
            echo "REGISTRY=$REGISTRY"
            echo "REPOSITORY=$REPOSITORY"
            echo "IMAGE_NAME=$IMAGE_NAME"
            echo "TAG=$TAG"
            echo "ADDITIONAL_TAG=$ADDITIONAL_TAG"
          } >> "$GITHUB_ENV"

      - name: docker login
        if: inputs.push-image && github.actor != 'dependabot[bot]'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"

      #Exposes the Actions cache credentials to buildx, which a plain run step cannot see.
      - uses: crazy-max/ghaction-github-runtime@v4
        if: inputs.buildkit-cache

      - name: docker buildx build/push
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1 #Note: fixes publishing container architecture 'unknown/unknown'
        run: |
          set -euo pipefail
          TAG="${TAG:?}"
          ARTIFACT_DIRECTORY="$RUNNER_TEMP/container-image"

          #every build shares these, and the smoke test image must match what is published
          build() {
            docker buildx build \
              -f "$DOCKERFILE" \
              --label "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
              --label "IMAGE_NAME=$IMAGE_NAME" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --build-arg "GIT_REPOSITORY=$GITHUB_REPOSITORY" \
              --build-arg "GIT_BRANCH=$GITHUB_REF" \
              --build-arg "GIT_COMMIT=$GITHUB_SHA" \
              --build-arg "GIT_TAG=$TAG" \
              --build-arg "VERSION=$TAG" \
              --build-arg "GITHUB_WORKFLOW=$GITHUB_WORKFLOW" \
              --build-arg "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
              --build-arg "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER" \
              --pull \
              "$@" \
              .
          }

          TAGS=(-t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:$ADDITIONAL_TAG")

          #Split on whitespace only: no globbing, quote parsing or expansion of caller text.
          read -r -d '' -a ARGS <<< "$BUILD_ARGS" || true

          CACHE_FROM=()
          CACHE_TO=()
          if [[ "$BUILDKIT_CACHE" == "true" ]]; then
            CACHE_SCOPE="$REPOSITORY"
            if [[ "$NATIVE_BUILD" == "true" ]]; then CACHE_SCOPE+="-$PLATFORM_KEY"; fi
            CACHE_FROM=(--cache-from "type=gha,scope=$CACHE_SCOPE")
            CACHE_TO=(--cache-to "type=gha,mode=max,scope=$CACHE_SCOPE")
          fi

          PUSH_ARGS=()
          if [[ "$PUSH_IMAGE" == "true" ]]; then
            PUSH_ARGS+=(--push)
            if [[ "$ATTESTATIONS" == "true" ]]; then
              PUSH_ARGS+=(--provenance=mode=max --sbom=true)
            fi
          fi

          echo "REGISTRY=$REGISTRY"
          echo "REPOSITORY=$REPOSITORY"
          echo "TAG=$TAG"
          echo "TAGS=${TAGS[*]}"
          echo "ARGS=${ARGS[*]}"
          echo "PUSH_ARGS=${PUSH_ARGS[*]}"
          echo "DockerFile=$DOCKERFILE"

          if [[ -n "$SMOKE_TEST" ]]; then
            IMAGE="$IMAGE_NAME:smoke-test"

            echo "::group::docker buildx build --load --platform $SMOKE_TEST_PLATFORM"
            #the caller's args must be passed here too, or the smoke test runs against a different
            #image than the one published, and the build below misses the cache on every layer after
            #the first differing build-arg
            build --load --platform "$SMOKE_TEST_PLATFORM" -t "$IMAGE" "${CACHE_FROM[@]}" "${ARGS[@]}"
            echo "::endgroup::"

            echo "::group::smoke test"
            IMAGE="$IMAGE" bash -euo pipefail -c "$SMOKE_TEST"
            echo "::endgroup::"
          fi

          if [[ "$NATIVE_BUILD" == "true" ]]; then
            mkdir -p "$ARTIFACT_DIRECTORY"
            if [[ "$PUSH_IMAGE" == "true" ]]; then
              OUTPUT=(--output "type=image,name=$REGISTRY/$REPOSITORY,push-by-digest=true,name-canonical=true,push=true")
              if [[ "$ATTESTATIONS" == "true" ]]; then OUTPUT+=(--provenance=mode=max --sbom=true); fi
            else
              OUTPUT=(--tag "$REGISTRY/$REPOSITORY:fixture-$PLATFORM_KEY" \
                --output "type=docker,dest=$ARTIFACT_DIRECTORY/$PLATFORM_KEY.tar")
            fi
            build --platform "$PLATFORM" "${CACHE_FROM[@]}" "${CACHE_TO[@]}" "${ARGS[@]}" \
              "${OUTPUT[@]}" --metadata-file "$ARTIFACT_DIRECTORY/metadata.json"
            jq -ce --arg platform "$PLATFORM" \
              '{platform: $platform, digest: .["containerimage.digest"]} |
                if .digest | type == "string" and test("^sha256:[0-9a-f]{64}$")
                then . else error("Build did not return an image digest") end' \
              "$ARTIFACT_DIRECTORY/metadata.json" > "$ARTIFACT_DIRECTORY/$PLATFORM_KEY.json"
            rm "$ARTIFACT_DIRECTORY/metadata.json"
          else
            build "${TAGS[@]}" --platform "$PLATFORM" "${CACHE_FROM[@]}" "${CACHE_TO[@]}" "${ARGS[@]}" "${PUSH_ARGS[@]}"
          fi

      - uses: actions/upload-artifact@v7
        if: inputs.platform-runners != ''
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.key }}
          path: ${{ runner.temp }}/container-image/*
          if-no-files-found: error
          retention-days: 1

  container-image-finalize:
    needs: [prepare, container-image-build]
    if: inputs.platform-runners != ''
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ inputs.registry }}
      REPOSITORY: ${{ inputs.repository }}
      REPOSITORY_PREFIX: ${{ inputs.repository-prefix }}
      TAG: ${{ inputs.tag }}
      ALIAS_TAG: ${{ github.ref == inputs.default-branch && inputs.default-branch-tag || inputs.feature-branch-tag }}
      PLATFORM: ${{ inputs.platform }}
      PUSH_IMAGE: ${{ inputs.push-image && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-name }}-linux-*
          path: ${{ runner.temp }}/container-image
          merge-multiple: true

      - name: docker login
        if: inputs.push-image && github.actor != 'dependabot[bot]'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login "${REGISTRY,,}" -u "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"

      - name: assemble and verify multi-platform image
        run: |
          set -euo pipefail
          ARTIFACT_DIRECTORY="$RUNNER_TEMP/container-image"
          shopt -s nullglob
          if [[ -z "$REPOSITORY" ]]; then REPOSITORY="${GITHUB_REPOSITORY#"$GITHUB_REPOSITORY_OWNER"/}"; fi
          IMAGE="${REGISTRY,,}/${REPOSITORY_PREFIX,,}${REPOSITORY,,}"
          TAG="${TAG,,}"
          ALIAS_TAG="${ALIAS_TAG,,}"
          RECORDS=("$ARTIFACT_DIRECTORY"/linux-*.json)
          test "${#RECORDS[@]}" -gt 0
          jq -se --arg platforms "$PLATFORM" '
            ([.[].platform] | sort) == ($platforms | split(",") | sort) and
            all(.[]; .digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' "${RECORDS[@]}" > /dev/null
          if [[ "$PUSH_IMAGE" != "true" ]]; then
            REGISTRY_CONTAINER="container-image-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            trap 'docker rm -f "$REGISTRY_CONTAINER" > /dev/null' EXIT
            docker run --detach --name "$REGISTRY_CONTAINER" --publish 127.0.0.1:5000:5000 registry:3
            for archive in "$ARTIFACT_DIRECTORY"/*.tar; do docker load --input "$archive"; done
            SOURCE_IMAGE="$IMAGE"
            IMAGE=localhost:5000/container-fixture
          fi
          SOURCES=()
          for record in "${RECORDS[@]}"; do
            TARGET=$(jq -r .platform "$record")
            KEY="${TARGET//\//-}"
            if [[ "$PUSH_IMAGE" == "true" ]]; then
              DIGEST=$(jq -r .digest "$record")
            else
              docker tag "$SOURCE_IMAGE:fixture-$KEY" "$IMAGE:$KEY"
              docker push "$IMAGE:$KEY"
              DIGEST=$(docker image inspect "$IMAGE:$KEY" --format '{{json .RepoDigests}}' |
                jq -er --arg prefix "$IMAGE@" 'first(.[] | select(startswith($prefix)) | split("@")[1])')
            fi
            SOURCES+=("$IMAGE@$DIGEST")
          done
          docker buildx imagetools create --dry-run "${SOURCES[@]}" > "$ARTIFACT_DIRECTORY/index.json"
          jq -e --arg platforms "$PLATFORM" '
            [.manifests[].platform | select(.os != "unknown") |
              .os + "/" + .architecture +
              (if .variant and (.architecture != "arm64" or .variant != "v8") then "/" + .variant else "" end)] | sort |
            . == ($platforms | split(",") | sort)
          ' "$ARTIFACT_DIRECTORY/index.json" > /dev/null
          docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:$ALIAS_TAG" "${SOURCES[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw > "$ARTIFACT_DIRECTORY/published-index.json"
          jq -e --arg platforms "$PLATFORM" '
            [.manifests[].platform | select(.os != "unknown") |
              .os + "/" + .architecture +
              (if .variant and (.architecture != "arm64" or .variant != "v8") then "/" + .variant else "" end)] | sort |
            . == ($platforms | split(",") | sort)
          ' "$ARTIFACT_DIRECTORY/published-index.json" > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-index
          path: ${{ runner.temp }}/container-image/published-index.json
          if-no-files-found: error
          retention-days: 1

  container-image-result:
    needs: [prepare, container-image-build, container-image-finalize]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: require every selected image job to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.container-image-build.result }}
          FINALIZE_RESULT: ${{ needs.container-image-finalize.result }}
          NATIVE_BUILD: ${{ inputs.platform-runners != '' }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
          if [[ "$NATIVE_BUILD" == "true" ]]; then
            test "$FINALIZE_RESULT" = success
          else
            test "$FINALIZE_RESULT" = skipped
          fi
