name: _gitops-helm-update

on:
  workflow_call:
    inputs:
      manifest-paths:
        type: string
        description: Space-separated ArgoCD manifest paths.
        required: true
      tag:
        type: string
        description: Chart version e.g. 1.2.3
        required: true
      tag-override:
        type: string
        description: Image tag override e.g. latest-dev
      namespace:
        type: string
        description: Destination Kubernetes namespace.
        required: true
      image-registry:
        type: string
        description: Image registry e.g. ghcr.io/owner
        required: true
      image-repository:
        type: string
        description: Image repository or deployment identifier.
        required: true
      chart-registry:
        type: string
        description: Chart registry e.g. ghcr.io/owner
      chart-registry-username:
        type: string
      chart-registry-password:
        type: string
      chart-repository:
        type: string
        description: OCI chart repository path.
      gitops-repo:
        type: string
        description: GitOps repository e.g. owner/repository
        required: true
      gitops-repo-path:
        type: string
        description: Checkout path for the GitOps repository.
        default: .
      gitops-repo-branch:
        type: string
        description: GitOps branch name.
        default: main
      gitops-repo-update:
        type: boolean
        description: Whether to commit and push manifest changes.
        default: true
      gitops-repo-user-name:
        type: string
        description: Git commit user name.
        default: GitHub Actions Bot
      gitops-repo-user-email:
        type: string
        description: Git commit user email.
        default: github-actions[bot]@users.noreply.github.com
      devcontainer-path:
        type: string
        description: Devcontainer path used to resolve tool versions.
        default: .devcontainer/devcontainer.json
      environment:
        type: string
        description: GitHub deployment environment.
    secrets:
      GH_PAT_GITOPS:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ inputs.gitops-repo }}
          token: ${{ secrets.GH_PAT_GITOPS }}
          persist-credentials: true
          path: ${{ inputs.gitops-repo-path }}

      - name: update manifest
        uses: f2calv/gha-gitops-manifest-update@v2
        with:
          manifest-paths: ${{ inputs.manifest-paths }}
          tag: ${{ inputs.tag }}
          tag-override: ${{ inputs.tag-override }}
          namespace: ${{ inputs.namespace }}
          image-registry: ${{ inputs.image-registry }}
          image-repository: ${{ inputs.image-repository }}
          chart-registry: ${{ inputs.chart-registry }}
          chart-registry-username: ${{ inputs.chart-registry-username }}
          chart-registry-password: ${{ secrets.GITHUB_TOKEN }}
          chart-repository: ${{ inputs.chart-repository }}
          devcontainer-path: ${{ inputs.devcontainer-path }}
          git-repo-update: ${{ inputs.gitops-repo-update }}
          git-user-name: ${{ inputs.gitops-repo-user-name }}
          git-user-email: ${{ inputs.gitops-repo-user-email }}
          git-branch-name: ${{ inputs.gitops-repo-branch }}
          git-working-directory: ${{ inputs.gitops-repo-path }}
