name: _app-build-dotnet

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-latest
      version:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12+56
        required: true
      configuration:
        type: string
        description: e.g. Debug or Release
        default: Release
      solution-name:
        type: string
        description: e.g. MySolution.sln or MyProject.csproj
        default: ''
      dotnet-restore-args:
        type: string
        description: Optional 'dotnet restore' arguments.
        default: ''
      dotnet-build-args:
        type: string
        description: Optional 'dotnet build' arguments.
        default: ''
      execute-tests:
        type: boolean
        description: Execute tests unless explicitly disabled outside pull requests.
        default: true
      test-solution-name:
        type: string
        description: .NET solution or project to test e.g. MySolution.slnx or MyTests.csproj
        default: ''
      dotnet-test-args:
        type: string
        description: Optional 'dotnet test' arguments.
        default: ''
      extra-repos:
        type: string
        description: >
          JSON array of extra repositories to clone into the build context.
          Each element: {"repo":"owner/name","ref":"main","path":"deps/name"}
        default: '[]'

jobs:
  app-build-dotnet:
    runs-on: ${{ inputs.runs-on }}
    #if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: clone extra repositories
        if: inputs.extra-repos != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_REPOS: ${{ inputs.extra-repos }}
        run: |
          echo "$EXTRA_REPOS" | jq -c '.[]' | while read -r item; do
            REPO=$(echo "$item" | jq -r '.repo')
            REF=$(echo "$item" | jq -r '.ref // "HEAD"')
            DEST=$(echo "$item" | jq -r '.path // "deps"')
            echo "Cloning $REPO@$REF into $DEST"
            git clone --depth 1 --branch "$REF" \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$DEST"
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: dotnet workload restore
        run: dotnet workload restore ${{ inputs.solution-name }}

      - name: dotnet restore
        run: dotnet restore ${{ inputs.solution-name }} --verbosity minimal ${{ inputs.dotnet-restore-args }}

      - name: dotnet build
        run: dotnet build ${{ inputs.solution-name }} -c ${{ inputs.configuration }} --nologo --no-restore -p:Version='${{ inputs.version }}' -p:SourceRevisionId=${{ github.sha }} ${{ inputs.dotnet-build-args }}

      - name: dotnet test
        if: github.event_name == 'pull_request' || inputs.execute-tests
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          DOTNET_TEST_ARGS: ${{ inputs.dotnet-test-args }}
          TEST_TARGET: ${{ inputs.test-solution-name || inputs.solution-name }}
        run: |
          set -euo pipefail
          command=(dotnet test)
          if jq -e '.test.runner == "Microsoft.Testing.Platform"' global.json >/dev/null 2>&1; then
            case "$TEST_TARGET" in
              '') ;;
              *.sln | *.slnx) command+=(--solution "$TEST_TARGET") ;;
              *.csproj) command+=(--project "$TEST_TARGET") ;;
              *) echo "::error::test-solution-name must resolve to a .sln, .slnx or .csproj file."; exit 1 ;;
            esac
          elif [[ -n "$TEST_TARGET" ]]; then
            command+=("$TEST_TARGET")
          fi
          command+=(-c "$CONFIGURATION" --no-restore --no-build)
          read -ra extra_args <<<"$DOTNET_TEST_ARGS"
          command+=("${extra_args[@]}")
          echo "${command[*]}"
          "${command[@]}"
