name: _app-build-dotnet

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      version:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12+56
        required: true
      configuration:
        type: string
        description: e.g. Debug or Release
        default: Release
      solution-name:
        type: string
        description: e.g. MySolution.sln or MyProject.csproj
        default: ''
      dotnet-restore-args:
        type: string
        description: Optional 'dotnet restore' arguments.
        default: ''
      dotnet-build-args:
        type: string
        description: Optional 'dotnet build' arguments.
        default: ''
      execute-tests:
        type: boolean
        description: Execute tests and provision any configured test services.
        default: true
      test-solution-name:
        type: string
        description: Optional .NET solution or project to test; empty uses solution-name.
        default: ''
      dotnet-test-args:
        type: string
        description: JSON array of optional 'dotnet test' arguments.
        default: '[]'
      collect-coverage:
        type: boolean
        description: Collect Microsoft.Testing.Platform XML coverage.
        default: false
      coverage-artifact-name:
        type: string
        description: Coverage artifact name.
        default: dotnet-coverage
      test-compose-file:
        type: string
        description: Optional Compose file used to provision test services.
        default: ''
      test-compose-services:
        type: string
        description: JSON array of Compose services required by tests.
        default: '[]'
      extra-repos:
        type: string
        description: >
          JSON array of extra repositories to clone into the build context.
          Each element: {"repo":"owner/name","ref":"main","path":"deps/name"}
        default: '[]'

jobs:
  app-build-dotnet:
    runs-on: ${{ inputs.runs-on }}
    #Inputs are free text, so scripts only ever read them as quoted environment variables.
    env:
      VERSION: ${{ inputs.version }}
      CONFIGURATION: ${{ inputs.configuration }}
      SOLUTION_NAME: ${{ inputs.solution-name }}
      TEST_SOLUTION_NAME: ${{ inputs.test-solution-name }}
      DOTNET_RESTORE_ARGS: ${{ inputs.dotnet-restore-args }}
      DOTNET_BUILD_ARGS: ${{ inputs.dotnet-build-args }}
      COLLECT_COVERAGE: ${{ inputs.collect-coverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: clone extra repositories
        if: inputs.extra-repos != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_REPOS: ${{ inputs.extra-repos }}
        run: |
          echo "$EXTRA_REPOS" | jq -c '.[]' | while read -r item; do
            REPO=$(echo "$item" | jq -r '.repo')
            REF=$(echo "$item" | jq -r '.ref // "HEAD"')
            DEST=$(echo "$item" | jq -r '.path // "deps"')
            echo "Cloning $REPO@$REF into $DEST"
            git clone --depth 1 --branch "$REF" \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$DEST"
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      #Argument inputs are split on whitespace only: no globbing, quote parsing or expansion of caller text.
      - name: dotnet workload restore/restore/build
        run: |
          set -euo pipefail
          TARGET=()
          [[ -z "$SOLUTION_NAME" ]] || TARGET=("$SOLUTION_NAME")
          read -r -d '' -a RESTORE_ARGS <<< "$DOTNET_RESTORE_ARGS" || true
          read -r -d '' -a BUILD_ARGS <<< "$DOTNET_BUILD_ARGS" || true

          dotnet workload restore "${TARGET[@]}"
          dotnet restore "${TARGET[@]}" --verbosity minimal "${RESTORE_ARGS[@]}"
          dotnet build "${TARGET[@]}" -c "$CONFIGURATION" --nologo --no-restore \
            -p:Version="$VERSION" -p:SourceRevisionId="$GITHUB_SHA" \
            -p:GitRepository="$GITHUB_REPOSITORY" -p:GitBranch="$GITHUB_REF" \
            -p:BuildWorkflow="$GITHUB_WORKFLOW" -p:BuildRunId="$GITHUB_RUN_ID" \
            -p:BuildRunNumber="$GITHUB_RUN_NUMBER" "${BUILD_ARGS[@]}"

      - name: dotnet restore/build (test target)
        if: inputs.test-solution-name != '' && inputs.test-solution-name != inputs.solution-name
        run: |
          set -euo pipefail
          read -r -d '' -a RESTORE_ARGS <<< "$DOTNET_RESTORE_ARGS" || true
          read -r -d '' -a BUILD_ARGS <<< "$DOTNET_BUILD_ARGS" || true

          dotnet restore "$TEST_SOLUTION_NAME" --verbosity minimal "${RESTORE_ARGS[@]}"
          dotnet build "$TEST_SOLUTION_NAME" -c "$CONFIGURATION" --no-restore --nologo \
            -p:Version="$VERSION" -p:SourceRevisionId="$GITHUB_SHA" \
            -p:GitRepository="$GITHUB_REPOSITORY" -p:GitBranch="$GITHUB_REF" \
            -p:BuildWorkflow="$GITHUB_WORKFLOW" -p:BuildRunId="$GITHUB_RUN_ID" \
            -p:BuildRunNumber="$GITHUB_RUN_NUMBER" "${BUILD_ARGS[@]}"
      - name: configure Docker Compose (test services)
        if: inputs.execute-tests && inputs.test-compose-services != '[]'
        id: compose
        shell: bash
        run: |
          echo "COMPOSE_PROJECT_NAME=gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${RANDOM}${RANDOM}" >> "$GITHUB_ENV"
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: docker compose up (test services)
        if: inputs.execute-tests && inputs.test-compose-services != '[]'
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.test-compose-file }}
          COMPOSE_SERVICES: ${{ inputs.test-compose-services }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<<"$COMPOSE_SERVICES" >/dev/null; then
            echo "::error::test-compose-services must be a non-empty JSON array of service names."
            exit 1
          fi
          command=(docker compose)
          if [[ -n "$COMPOSE_FILE" ]]; then
            command+=(--file "$COMPOSE_FILE")
          fi
          mapfile -t services < <(jq -r '.[]' <<<"$COMPOSE_SERVICES")
          command+=(up --detach --wait)
          command+=("${services[@]}")
          echo "${command[*]}"
          "${command[@]}"

      - name: dotnet test
        if: inputs.execute-tests
        shell: bash
        env:
          DOTNET_TEST_ARGS: ${{ inputs.dotnet-test-args }}
          TEST_TARGET: ${{ inputs.test-solution-name || inputs.solution-name }}
        run: |
          set -euo pipefail
          if ! jq -e '.test.runner == "Microsoft.Testing.Platform"' global.json >/dev/null 2>&1; then
            echo "::error::global.json must select test.runner=Microsoft.Testing.Platform."
            exit 1
          fi
          command=(dotnet test)
          case "$TEST_TARGET" in
            '') ;;
            *.sln | *.slnx) command+=(--solution "$TEST_TARGET") ;;
            *.csproj) command+=(--project "$TEST_TARGET") ;;
            *) echo "::error::test-solution-name must resolve to a .sln, .slnx or .csproj file."; exit 1 ;;
          esac
          command+=(-c "$CONFIGURATION" --no-restore --no-build)
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$DOTNET_TEST_ARGS" >/dev/null; then
            echo "::error::dotnet-test-args must be a JSON array of strings."
            exit 1
          fi
          mapfile -t extra_args < <(jq -r '.[]' <<<"$DOTNET_TEST_ARGS")
          command+=("${extra_args[@]}")
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            command+=(--coverage --coverage-output-format xml)
          fi
          echo "${command[*]}"
          "${command[@]}"

      - uses: actions/upload-artifact@v7
        if: inputs.collect-coverage && inputs.execute-tests
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: TestResults/**/*.xml
          if-no-files-found: error
          retention-days: 1

      - name: docker compose down (test services)
        if: always() && steps.compose.outputs.configured == 'true'
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.test-compose-file }}
        run: |
          set -euo pipefail
          command=(docker compose)
          if [[ -n "$COMPOSE_FILE" ]]; then
            command+=(--file "$COMPOSE_FILE")
          fi
          command+=(down --volumes --remove-orphans)
          echo "${command[*]}"
          "${command[@]}"
