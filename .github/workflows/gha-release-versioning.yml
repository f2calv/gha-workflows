name: _gha-release-versioning
#Determines a semantic version and, when requested, tags the commit and creates a GitHub Release.

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      semVer:
        description: Externally calculated version e.g. 1.2.3; empty runs GitVersion
        required: false
        type: string
        default: ''
      tag-prefix:
        description: Tag prefix e.g. v, empty or component/
        required: false
        type: string
        default: v
      move-major-tag:
        description: Move the floating major and minor alias tags
        required: false
        type: boolean
        default: true
      tag-and-release:
        description: Create the version tag and GitHub Release
        required: false
        type: boolean
        default: true
      tag-only:
        description: Create only the version tag; overrides tag-and-release
        required: false
        type: boolean
        default: false
      release-branch:
        description: Branch allowed to release; empty uses the default branch
        required: false
        type: string
        default: ''
      gv-config:
        description: GitVersion configuration file e.g. GitVersion.yml
        type: string
        default: GitVersion.yml
      gv-source:
        description: GitVersion source e.g. actions, dotnet or container
        type: string
        default: actions
    outputs:
      version:
        description: e.g. 1.2.301-feature-my-feature.12+56
        value: ${{ jobs.gha-release-versioning.outputs.version }}
      major:
        description: e.g. 1
        value: ${{ jobs.gha-release-versioning.outputs.major }}
      minor:
        description: e.g. 2
        value: ${{ jobs.gha-release-versioning.outputs.minor }}
      patch:
        description: e.g. 301
        value: ${{ jobs.gha-release-versioning.outputs.patch }}
      release-exists:
        description: e.g. true or false
        value: ${{ jobs.gha-release-versioning.outputs.release-exists }}

#No permissions block: versioning callers grant contents read, releasing callers contents write.
jobs:
  gha-release-versioning:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      version: ${{ steps.gha-release-versioning.outputs.version }}
      major: ${{ steps.gha-release-versioning.outputs.major }}
      minor: ${{ steps.gha-release-versioning.outputs.minor }}
      patch: ${{ steps.gha-release-versioning.outputs.patch }}
      release-exists: ${{ steps.gha-release-versioning.outputs.release-exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: f2calv/gha-release-versioning@v1
        id: gha-release-versioning
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          semVer: ${{ inputs.semVer }}
          tag-prefix: ${{ inputs.tag-prefix }}
          move-major-tag: ${{ inputs.move-major-tag }}
          tag-and-release: ${{ inputs.tag-and-release }}
          tag-only: ${{ inputs.tag-only }}
          release-branch: ${{ inputs.release-branch }}
          gv-config: ${{ inputs.gv-config }}
          gv-source: ${{ inputs.gv-source }}
