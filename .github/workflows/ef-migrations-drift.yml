name: _ef-migrations-drift

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      project:
        type: string
        description: Migrations/target project or solution (e.g. src/CasCap.Data/CasCap.Data.csproj)
        required: true
      startup-project:
        type: string
        description: Design-time startup project (defaults to `project` when empty)
        default: ''
      context:
        type: string
        description: DbContext name (optional; omit when the project has a single context)
        default: ''
      configuration:
        type: string
        description: e.g. Debug or Release
        default: Release
      extra-repos:
        type: string
        description: >
          JSON array of extra repositories to clone (Debug builds with sibling ProjectReferences).
          Each element: {"repo":"owner/name","ref":"main","path":"deps/name"}
        default: '[]'

jobs:
  ef-migrations-drift:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    #Free-text inputs are only ever read as quoted environment variables.
    env:
      PROJECT: ${{ inputs.project }}
      STARTUP_PROJECT: ${{ inputs.startup-project }}
      DB_CONTEXT: ${{ inputs.context }}
      CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: clone extra repositories
        if: inputs.extra-repos != '[]'
        uses: f2calv/gha-workflows/.github/actions/clone-extra-repos@v1
        with:
          repos: ${{ inputs.extra-repos }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: dotnet tool restore
        run: dotnet tool restore

      - name: dotnet restore
        run: dotnet restore "$PROJECT" -p:Configuration="$CONFIGURATION" --verbosity minimal

      - name: dotnet ef migrations has-pending-model-changes
        run: |
          set -euo pipefail
          ARGS=(--project "$PROJECT" --startup-project "${STARTUP_PROJECT:-$PROJECT}" --configuration "$CONFIGURATION")
          [[ -z "$DB_CONTEXT" ]] || ARGS+=(--context "$DB_CONTEXT")
          dotnet ef migrations has-pending-model-changes "${ARGS[@]}"
