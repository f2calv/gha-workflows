name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  versioning:
    uses: ./.github/workflows/gha-release-versioning.yml
    with:
      tag-and-release: false
    permissions:
      contents: read

  validate:
    needs: versioning
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: README floating major tag
        env:
          EXPECTED_WORKFLOW_REF: '@v${{ needs.versioning.outputs.major }}'
        run: grep --extended-regexp --quiet "f2calv/gha-workflows/\.github/workflows/.+${EXPECTED_WORKFLOW_REF}([^[:alnum:]_.-]|$)" README.md

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, versioning, validate]
    uses: ./.github/workflows/gha-release-versioning.yml
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
    permissions:
      contents: write
