name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  versioning:
    uses: ./.github/workflows/gha-release-versioning.yml
    with:
      tag-and-release: false
    permissions:
      contents: read

  validate:
    needs: versioning
    uses: ./.github/workflows/readme-ref-check.yml
    with:
      major: ${{ needs.versioning.outputs.major }}
      reference-prefix: ${{ format('{0}/\.github/workflows/.+@', github.repository) }}
    permissions:
      contents: read

  #Self-tests: each job calls the workflow from this commit against a fixture under tests/fixtures,
  #so a change is exercised before the floating major alias moves to it.
  test-dotnet:
    needs: versioning
    uses: ./.github/workflows/app-build-dotnet.yml
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: tests/fixtures/dotnet/Fixture.slnx
      collect-coverage: true
      coverage-artifact-name: fixture-coverage
      dotnet-build-args: -p:Deterministic=true -p:ContinuousIntegrationBuild=true
      #Exercises the published clone-extra-repos action through the reusable workflow.
      extra-repos: '[{"repo":"f2calv/gha-check-release-exists","path":"deps/gha-check-release-exists"}]'
    permissions:
      contents: read

  test-container-inputs:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: test platform runner input validation
        run: |
          set -euo pipefail
          SCRIPT=$(docker run --rm --volume "$PWD:/work:ro" --workdir /work mikefarah/yq:4 -r \
            '.jobs.prepare.steps[0].run' .github/workflows/container-image-build.yml)
          export PLATFORM=linux/amd64,linux/arm64 DEFAULT_RUNNER=ubuntu-26.04 ARTIFACT_NAME=fixture
          export GITHUB_OUTPUT
          GITHUB_OUTPUT=$(mktemp)
          trap 'rm -f "$GITHUB_OUTPUT"' EXIT
          export PLATFORM_RUNNERS=''
          bash -c "$SCRIPT"
          sed 's/^matrix=//' "$GITHUB_OUTPUT" | jq -e '.include | length == 1' > /dev/null
          CASES=1
          for mapping in \
            '[{"platform":"linux/amd64","runner":"ubuntu-26.04"},{"platform":"linux/arm64","runner":"ubuntu-26.04-arm"}]' \
            '[{"platform":"linux/amd64","runner":"ubuntu-26.04"},{"platform":"linux/arm64","runner":["self-hosted","linux","ARM64"]}]'; do
            export PLATFORM_RUNNERS="$mapping"
            : > "$GITHUB_OUTPUT"
            bash -c "$SCRIPT"
            sed 's/^matrix=//' "$GITHUB_OUTPUT" | jq -e '.include | length == 2' > /dev/null
            CASES=$((CASES + 1))
          done
          for mapping in \
            '[]' \
            'not-json' \
            '[{"platform":"linux/arm64","runner":"ubuntu-26.04-arm"}]' \
            '[{"platform":"linux/amd64","runner":"ubuntu-26.04"},{"platform":"linux/amd64","runner":"ubuntu-26.04"}]' \
            '[{"platform":"linux/amd64","runner":42},{"platform":"linux/arm64","runner":"ubuntu-26.04-arm"}]' \
            '[{"platform":"linux/amd64","runner":"ubuntu-26.04"},{"platform":"linux/arm64","runner":[]}]'; do
            export PLATFORM_RUNNERS="$mapping"
            if bash -c "$SCRIPT" > /dev/null 2>&1; then
              echo '::error::Invalid runner mapping was accepted'
              exit 1
            fi
            CASES=$((CASES + 1))
          done
          test "$CASES" -eq 9
          echo "Passed $CASES platform runner validation cases"

  test-container:
    needs: versioning
    uses: ./.github/workflows/container-image-build.yml
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      #Mixed case and multi-word args exercise the lowercasing and whitespace argument split.
      repository: GHA-Workflows-Fixture
      args: --label fixture=self-test --label org.opencontainers.image.title=fixture
      dockerfile: tests/fixtures/container/Dockerfile
      tag: ${{ needs.versioning.outputs.version }}
      platform: linux/amd64
      push-image: false
      buildkit-cache: true
      smoke-test: |
        EXPECTED='${{ needs.versioning.outputs.version }}'
        test "$(docker run --rm "$IMAGE")" = "${EXPECTED,,}"
    permissions:
      contents: read
      packages: write

  test-container-multiarch:
    needs: versioning
    uses: ./.github/workflows/container-image-build.yml
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      repository: GHA-Workflows-Fixture-Multiarch
      dockerfile: tests/fixtures/container/Dockerfile
      tag: ${{ needs.versioning.outputs.version }}
      platform: linux/amd64,linux/arm64,linux/arm/v7
      push-image: false
      buildkit-cache: true
      smoke-test: |
        EXPECTED='${{ needs.versioning.outputs.version }}'
        test "$(docker run --rm --read-only --network none "$IMAGE")" = "${EXPECTED,,}"
    permissions:
      contents: read
      packages: write

  test-container-aot:
    needs: versioning
    uses: ./.github/workflows/container-image-build.yml
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      repository: GHA-Workflows-Fixture-Aot
      dockerfile: tests/fixtures/container-aot/Dockerfile
      tag: ${{ needs.versioning.outputs.version }}
      platform: linux/amd64,linux/arm64
      platform-runners: >-
        [{"platform":"linux/amd64","runner":"ubuntu-26.04"},
        {"platform":"linux/arm64","runner":"ubuntu-26.04-arm"}]
      artifact-name: container-aot
      push-image: false
      buildkit-cache: true
      smoke-test: |
        EXPECTED='${{ needs.versioning.outputs.version }}'
        case "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" in
          amd64) PROCESS_ARCH=X64 ;;
          arm64) PROCESS_ARCH=Arm64 ;;
          *) exit 1 ;;
        esac
        test "$(docker run --rm --read-only --network none "$IMAGE")" = "${EXPECTED,,}|$PROCESS_ARCH|False"
    permissions:
      contents: read
      packages: write

  test-helm:
    needs: versioning
    uses: ./.github/workflows/helm-chart-package.yml
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io
      #Mixed case exercises lowercasing; values.yaml must receive the lowercased coordinate and tag.
      image-repository: ${{ github.repository_owner }}/Fixture-App
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      chart-repository: ${{ github.repository_owner }}/charts/fixture-app
      chart-path: tests/fixtures/charts/fixture-app
      push-chart: false
    permissions:
      contents: read
      packages: write

  test-helm-lint:
    uses: ./.github/workflows/helm-lint.yml
    with:
      charts: '["tests/fixtures/charts/fixture-app"]'
    permissions:
      contents: read

  test-terraform-test:
    uses: ./.github/workflows/terraform.yml
    with:
      command: test
      working-directory: tests/fixtures/terraform
      azure-login: false
    #The online job's id-token write is validated at startup even when it is skipped.
    permissions:
      contents: read
      id-token: write

  #Local reference: the same action is consumed by the workflows only once published.
  test-devcontainer-tool-versions:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/devcontainer-tool-versions
        id: tools

      - name: assert helm version from devcontainer.json
        env:
          HELM_VERSION: ${{ steps.tools.outputs.helm }}
          YQ_VERSION: ${{ steps.tools.outputs.yq }}
        run: |
          echo "helm=$HELM_VERSION yq=$YQ_VERSION"
          test "$HELM_VERSION" = 3.20.2
          test "$YQ_VERSION" = latest
          git diff --exit-code -- .devcontainer/devcontainer.json

  #release: false - the nested release job must never tag this repository.
  test-dotnet-nuget-library:
    uses: ./.github/workflows/dotnet-nuget-library.yml
    with:
      solution-name: tests/fixtures/dotnet/Fixture.slnx
      dotnet-test-args: '["--minimum-expected-tests", "4"]'
      code-coverage: false
      release: false
    #The nested release job's contents write is validated at startup even though release is false.
    permissions:
      contents: write
      id-token: write
      packages: write

  test-go:
    needs: versioning
    uses: ./.github/workflows/app-build-go.yml
    with:
      version: ${{ needs.versioning.outputs.version }}
      go-version-file: tests/fixtures/go/go.mod
      working-directory: tests/fixtures/go
    permissions:
      contents: read

  test-rust:
    needs: versioning
    uses: ./.github/workflows/app-build-rust.yml
    with:
      version: ${{ needs.versioning.outputs.version }}
      working-directory: tests/fixtures/rust
    permissions:
      contents: read

  test-python:
    needs: versioning
    uses: ./.github/workflows/app-build-python.yml
    with:
      version: ${{ needs.versioning.outputs.version }}
      working-directory: tests/fixtures/python
    permissions:
      contents: read

  test-terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      command: validate
      working-directory: tests/fixtures/terraform
      azure-login: false
    #The online job's id-token write is validated at startup even when it is skipped.
    permissions:
      contents: read
      id-token: write

  test-ef-drift:
    uses: ./.github/workflows/ef-migrations-drift.yml
    with:
      project: tests/fixtures/dotnet/src/Fixture.Data/Fixture.Data.csproj
    permissions:
      contents: read

  #Unsigned bundle only; deploy stays false so no signing secret or Play upload is involved.
  test-maui-android:
    uses: ./.github/workflows/deploy-maui-android.yml
    with:
      project: tests/fixtures/maui/Fixture.Maui/Fixture.Maui.csproj
    permissions:
      contents: read

  test-maui-windows:
    uses: ./.github/workflows/build-maui-windows.yml
    with:
      project: tests/fixtures/maui/Fixture.Maui/Fixture.Maui.csproj
      artifact-name: fixture-maui-windows
      retention-days: 1
    permissions:
      contents: read

  #The composite action is referenced locally here; reusable workflows can only reach it by a published ref.
  test-clone-extra-repos:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/clone-extra-repos
        with:
          repos: >-
            [{"repo":"f2calv/gha-check-release-exists","ref":"main","path":"deps/with-ref"},
            {"repo":"f2calv/gha-release-versioning","path":"deps/default-branch"}]

      - name: assert clones exist without persisted credentials
        run: |
          set -euo pipefail
          for dir in deps/with-ref deps/default-branch; do
            test -f "$dir/action.yml"
            if git -C "$dir" config --list | grep -qi -e extraheader -e x-access-token; then
              echo "::error::$dir persisted credentials in .git/config"
              exit 1
            fi
          done

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, versioning, validate, test-dotnet, test-container-inputs, test-container, test-container-multiarch, test-container-aot, test-helm, test-go, test-rust, test-python, test-terraform, test-terraform-test, test-helm-lint, test-devcontainer-tool-versions, test-dotnet-nuget-library, test-ef-drift, test-maui-android, test-maui-windows, test-clone-extra-repos]
    uses: ./.github/workflows/gha-release-versioning.yml
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
    permissions:
      contents: write
