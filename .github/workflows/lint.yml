name: _lint

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      pre-commit-version:
        description: Set pre-commit version.
        type: string
        default: 4.6.2

permissions: {}

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    env:
      PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      #Hook environments are keyed on the configuration, so an unchanged config reuses them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      #https://pre-commit.com/
      - name: pre-commit run --all-files
        run: |
          set -euo pipefail
          [[ "$PRE_COMMIT_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::pre-commit-version '$PRE_COMMIT_VERSION' is invalid."; exit 1; }
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip install --quiet "pre-commit~=$PRE_COMMIT_VERSION"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pre_commit run --all-files --verbose
