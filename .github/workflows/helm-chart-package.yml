name: _helm-chart-package

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      tag:
        type: string
        description: Chart version e.g. 1.2.3
        required: true
      tag-override:
        type: string
        description: Image tag override e.g. latest-dev
      image-registry:
        type: string
        description: e.g. ghcr.io, xyz.azurecr.io or docker.io
        required: true
      image-repository:
        type: string
        description: Image repository e.g. owner/my-app
        required: true
      chart-registry:
        type: string
        description: e.g. ghcr.io, xyz.azurecr.io or docker.io
        required: true
      chart-registry-username:
        type: string
        description: Chart registry username e.g. github.repository_owner
      #The chart is pushed to dirname(chart-repository); its final segment must equal the chart name.
      chart-repository:
        type: string
        description: Full OCI chart coordinate e.g. owner/charts/my-app
        required: true
      #The basename must equal the Chart.yaml name and the final segment of chart-repository.
      chart-path:
        type: string
        description: Chart directory e.g. charts/my-app
        default: ./charts/
      is-library-chart:
        type: boolean
        description: Is the helm chart a library chart?
        default: false
      set-chart-app-version:
        type: boolean
        description: Set Chart.yaml appVersion and the packaged app version from tag.
        default: true
      has-image:
        type: boolean
        description: Whether the chart owns image and provenance values.
        default: true
      push-chart:
        type: boolean
        description: Push the packaged chart.
        default: true
      #chart-testing publishes no major-version alias, so pin the full release.
      chart-testing-cli-version:
        type: string
        description: chart-testing image tag e.g. v3.15.0
        default: v3.15.0
      #skip relies on the helm lint run during packaging.
      chart-testing-cli-command:
        type: string
        description: lint, install or skip
        default: lint
      chart-dependency-name:
        type: string
        description: Local chart dependency to version with tag.

permissions: {}

jobs:
  helm-chart-package:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    #Inputs are free text, so scripts only ever read them as quoted environment variables. Values the
    #first step normalises arrive as IN_*, because job env would override a same-named GITHUB_ENV value.
    env:
      TAG: ${{ inputs.tag }}
      TAG_OVERRIDE: ${{ inputs.tag-override }}
      IN_IMAGE_REGISTRY: ${{ inputs.image-registry }}
      IN_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      IN_CHART_REGISTRY: ${{ inputs.chart-registry }}
      CHART_REGISTRY_USERNAME: ${{ inputs.chart-registry-username }}
      IN_CHART_REPOSITORY: ${{ inputs.chart-repository }}
      CHART_PATH: ${{ inputs.chart-path }}
      CHART_DEPENDENCY: ${{ inputs.chart-dependency-name }}
      IS_LIBRARY_CHART: ${{ inputs.is-library-chart }}
      SET_CHART_APP_VERSION: ${{ inputs.set-chart-app-version }}
      HAS_IMAGE: ${{ inputs.has-image }}
      PUSH_CHART: ${{ inputs.push-chart }}
      CHART_TESTING_CLI_VERSION: ${{ inputs.chart-testing-cli-version }}
      CHART_TESTING_CLI_COMMAND: ${{ inputs.chart-testing-cli-command }}
      ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
    steps:
      - name: validate inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          require() { [[ "$2" =~ $3 ]] || fail "$1 '$2' is invalid."; }

          #Lowercase OCI coordinates before validation; values never reach GITHUB_ENV unvalidated.
          IMAGE_REGISTRY=${IN_IMAGE_REGISTRY,,}
          IMAGE_REPOSITORY=${IN_IMAGE_REPOSITORY,,}
          CHART_REGISTRY=${IN_CHART_REGISTRY,,}
          CHART_REPOSITORY=${IN_CHART_REPOSITORY,,}

          VERSION_PATTERN='^[0-9A-Za-z][0-9A-Za-z._+-]*$'
          OCI_PATTERN='^[a-z0-9][a-z0-9._:/-]*$'
          require tag "$TAG" "$VERSION_PATTERN"
          [[ -z "$TAG_OVERRIDE" ]] || require tag-override "$TAG_OVERRIDE" "$VERSION_PATTERN"
          require image-registry "$IMAGE_REGISTRY" "$OCI_PATTERN"
          require image-repository "$IMAGE_REPOSITORY" "$OCI_PATTERN"
          require chart-registry "$CHART_REGISTRY" "$OCI_PATTERN"
          require chart-repository "$CHART_REPOSITORY" "$OCI_PATTERN"
          require chart-path "$CHART_PATH" '^[A-Za-z0-9._/-]+$'
          [[ -z "$CHART_DEPENDENCY" ]] || require chart-dependency-name "$CHART_DEPENDENCY" '^[A-Za-z0-9._-]+$'
          [[ -z "$CHART_REGISTRY_USERNAME" ]] || require chart-registry-username "$CHART_REGISTRY_USERNAME" '^[A-Za-z0-9._-]+$'
          require chart-testing-cli-version "$CHART_TESTING_CLI_VERSION" '^[A-Za-z0-9._-]+$'
          case "$CHART_TESTING_CLI_COMMAND" in
            lint | install | skip) ;;
            *) fail "chart-testing-cli-command must be lint, install or skip." ;;
          esac

          IMAGE_PREFIX="$IMAGE_REGISTRY/$IMAGE_REPOSITORY"
          #Matches the lowercased tag container-image-build publishes.
          IMAGE_TAG="${TAG_OVERRIDE:-$TAG}"
          IMAGE_TAG=${IMAGE_TAG,,}
          CHART_NAME=$(basename "$CHART_PATH")
          CHART_REPOSITORY_PREFIX=$(dirname "$CHART_REPOSITORY")

          LABEL="$IMAGE_REPOSITORY-$IMAGE_TAG"
          if [[ "${#LABEL}" -gt 63 ]]; then
            fail "RFC 1123 label '$LABEL' exceeds 63 characters; shorten the repository or branch name."
          fi

          {
            echo "IMAGE_REGISTRY=$IMAGE_REGISTRY"
            echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY"
            echo "CHART_REGISTRY=$CHART_REGISTRY"
            echo "CHART_REPOSITORY=$CHART_REPOSITORY"
            echo "IMAGE_PREFIX=$IMAGE_PREFIX"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "CHART_NAME=$CHART_NAME"
            echo "CHART_REPOSITORY_PREFIX=$CHART_REPOSITORY_PREFIX"
          } >> "$GITHUB_ENV"

          printf '%s=%s\n' \
            TAG "$TAG" IMAGE_PREFIX "$IMAGE_PREFIX" IMAGE_TAG "$IMAGE_TAG" \
            CHART_REGISTRY "$CHART_REGISTRY" CHART_REPOSITORY "$CHART_REPOSITORY" \
            CHART_PATH "$CHART_PATH" CHART_NAME "$CHART_NAME" CHART_DEPENDENCY "$CHART_DEPENDENCY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup helm (1 of 3)
        run: |
          FILE=.devcontainer/devcontainer.json
          if [[ -f "$FILE" ]]; then
            echo "$FILE exists"
          else
            echo "::error file=$FILE::helm version is managed by the devcontainer.json, '$FILE' is therefore required!"
            exit 1
          fi

      - name: setup helm (2 of 3) #pull version from devcontainer.json
        run: |
          npm install --global json5
          json5 -c .devcontainer/devcontainer.json
          VERSION_TO_INSTALL=$(jq -r '.features[] | select(.helm | . != null).helm' .devcontainer/devcontainer.json)
          git restore .devcontainer/devcontainer.json
          echo "VERSION_TO_INSTALL=$VERSION_TO_INSTALL" >> "$GITHUB_ENV"
          echo "VERSION_TO_INSTALL=$VERSION_TO_INSTALL"

      - name: setup helm (3 of 3)
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.VERSION_TO_INSTALL }}

      - name: helm registry login
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login "$CHART_REGISTRY/$CHART_REPOSITORY" \
            --username "$CHART_REGISTRY_USERNAME" --password-stdin <<< "$REGISTRY_TOKEN"

      - name: helm build/lint/package
        run: |
          set -euo pipefail
          helm version

          if [[ -n "$CHART_DEPENDENCY" ]]; then
            echo "Update the local chart dependency in Chart.yaml"
            export DEPENDENCY_REPOSITORY="oci://$CHART_REGISTRY/$CHART_REPOSITORY_PREFIX"
            echo "DEPENDENCY_REPOSITORY=$DEPENDENCY_REPOSITORY"
            yq -i '(.dependencies.[] | select(.name == env(CHART_DEPENDENCY)) | .version) = env(TAG)' "$CHART_PATH/Chart.yaml"
            yq -i '(.dependencies.[] | select(.name == env(CHART_DEPENDENCY)) | .repository) = env(DEPENDENCY_REPOSITORY)' "$CHART_PATH/Chart.yaml"
          fi

          yq -i '.version = env(TAG)' "$CHART_PATH/Chart.yaml"
          if [[ "$SET_CHART_APP_VERSION" == "true" ]]; then
            yq -i '.appVersion = env(TAG)' "$CHART_PATH/Chart.yaml"
          fi
          cat "$CHART_PATH/Chart.yaml"

          if [[ "$IS_LIBRARY_CHART" == "false" && "$HAS_IMAGE" == "true" ]]; then
            yq -i '.image.repository = env(IMAGE_PREFIX)' "$CHART_PATH/values.yaml"
            yq -i '.image.tag = env(IMAGE_TAG)' "$CHART_PATH/values.yaml"
            cat "$CHART_PATH/values.yaml"
          fi

          #Pulling a library chart from a private ghcr package requires granting this repository access to it.
          #https://helm.sh/docs/helm/helm_dependency_update/
          helm dependency update "$CHART_PATH"
          helm dependency list "$CHART_PATH"
          helm lint "$CHART_PATH"

          PACKAGE_ARGS=(--destination "$ARTIFACTS_PATH" --version "$TAG")
          if [[ "$IS_LIBRARY_CHART" == "false" && "$SET_CHART_APP_VERSION" == "true" ]]; then
            PACKAGE_ARGS+=(--app-version "$TAG")
          fi
          helm package "$CHART_PATH" "${PACKAGE_ARGS[@]}"

          if [[ "$IS_LIBRARY_CHART" == "false" ]]; then
            helm template "$CHART_NAME" "$CHART_PATH" > "$ARTIFACTS_PATH/$CHART_NAME.yaml"
            cat "$ARTIFACTS_PATH/$CHART_NAME.yaml"
          else
            echo "helm template skipped for a library chart"
          fi

      - uses: helm/kind-action@v1
        if: inputs.chart-testing-cli-command == 'install' && !inputs.is-library-chart

      #https://github.com/helm/chart-testing/blob/main/doc/ct_lint.md
      - name: chart-testing (lint)
        if: inputs.chart-testing-cli-command == 'lint'
        run: |
          EXTRA_ARGS=()
          if [[ "$HAS_IMAGE" == "true" ]]; then
            EXTRA_ARGS=(--helm-lint-extra-args "--set=image.tag=$TAG")
          fi
          docker run --rm --network host --workdir=/data --volume ~/.kube/config:/root/.kube/config:ro \
            --volume "$PWD:/data" "quay.io/helmpack/chart-testing:$CHART_TESTING_CLI_VERSION" \
            ct lint --charts "$CHART_PATH" "${EXTRA_ARGS[@]}" --validate-maintainers=false

      #https://github.com/helm/chart-testing/blob/main/doc/ct_install.md
      - name: chart-testing (install)
        if: inputs.chart-testing-cli-command == 'install' && !inputs.is-library-chart
        run: |
          EXTRA_ARGS=()
          if [[ "$HAS_IMAGE" == "true" ]]; then
            #An unpublished image cannot be pulled, so install a placeholder instead.
            SET_ARGS="--set=image.tag=$TAG"
            if [[ "$PUSH_CHART" == "false" ]]; then
              SET_ARGS="--set=image.repository=nginx --set=image.tag=latest"
            fi
            EXTRA_ARGS=(--helm-extra-set-args "$SET_ARGS")
          fi
          docker run --rm --network host --workdir=/data --volume ~/.kube/config:/root/.kube/config:ro \
            --volume "$PWD:/data" "quay.io/helmpack/chart-testing:$CHART_TESTING_CLI_VERSION" \
            ct install --charts "$CHART_PATH" "${EXTRA_ARGS[@]}" --build-id "$GITHUB_RUN_ID"

      #https://helm.sh/docs/helm/helm_push/
      - name: helm push
        if: inputs.push-chart
        run: helm push "$ARTIFACTS_PATH/$CHART_NAME-$TAG.tgz" "oci://$CHART_REGISTRY/$CHART_REPOSITORY_PREFIX"
