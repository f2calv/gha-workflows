name: _app-build-rust

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      #Exported to every Cargo step as VERSION, e.g. for option_env!("VERSION") in the crate.
      version:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12+56
        required: true
      working-directory:
        type: string
        description: Cargo project directory e.g. src/my-app
        default: .
      execute-tests:
        type: boolean
        description: Run cargo test.
        default: true

permissions: {}

jobs:
  app-build-rust:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      #Honours rust-toolchain.toml when present and caches the Cargo registry and target directory.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache-workspaces: ${{ inputs.working-directory }}
          rust-src-dir: ${{ inputs.working-directory }}

      - name: cargo version
        run: cargo version

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo fetch
        run: cargo fetch

      - name: cargo build
        run: cargo build --release

      - name: cargo test
        if: inputs.execute-tests
        run: cargo test --release
