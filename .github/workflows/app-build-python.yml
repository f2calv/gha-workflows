name: _app-build-python

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      #Exported to every step as VERSION, e.g. for a dynamic version in the build backend.
      version:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12+56
        required: true
      working-directory:
        type: string
        description: uv project directory e.g. src/my-app
        default: .

permissions: {}

jobs:
  app-build-python:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-uv does not publish a moving major-version tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          working-directory: ${{ inputs.working-directory }}

      - name: uv version
        run: uv version

      - name: uv lock --check
        run: uv lock --check

      - name: uv sync --locked --all-groups
        run: uv sync --locked --all-groups

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: mypy
        run: uv run --no-sync mypy

      - name: pytest
        run: uv run --no-sync pytest

      - name: uv build
        run: uv build
