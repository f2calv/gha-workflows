name: _app-build-go

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      version:
        type: string
        description: e.g. 1.2.301-feature-my-feature.12+56
        required: true
      #Relative to the repository root, not to working-directory.
      go-version-file:
        type: string
        description: Path to the go.mod that pins the Go toolchain version.
        default: go.mod
      working-directory:
        type: string
        description: Go module directory e.g. src/my-app
        default: .
      package:
        type: string
        description: Package pattern to build/vet/test, e.g. ./... or ./src/my-app
        default: ./...
      ldflags:
        type: string
        description: Optional additional linker flags appended to the default -s -w.
        default: ''

permissions: {}

jobs:
  app-build-go:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    #Free-text inputs are only ever read as quoted environment variables.
    env:
      VERSION: ${{ inputs.version }}
      PACKAGE: ${{ inputs.package }}
      LDFLAGS: ${{ inputs.ldflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: go version
        run: go version

      - name: gofmt -l
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "::error::the following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet "$PACKAGE"

      #Must support the module's Go release; older staticcheck cannot read newer export data.
      - uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.2"
          install-go: false
          working-directory: ${{ inputs.working-directory }}

      - name: go build
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION $LDFLAGS" "$PACKAGE"

      - name: go test
        run: go test -race "$PACKAGE"
