name: _test

on:
  workflow_dispatch:
    inputs:
      test-true:
        required: false
        type: boolean
        default: true
      test-false:
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: Runner label, e.g. ubuntu-24.04-arm for a native arm64 build.
        default: ubuntu-24.04
      test-true:
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      #workflow_dispatch fails
      - name: test1
        if: github.event.inputs.test-true == true
        run: |
          echo 'hello world'

      #workflow_dispatch works
      - name: test2
        if: github.event.inputs.test-true == 'true'
        run: |
          echo 'hello world'

      #workflow_dispatch works
      - name: test3
        if: inputs.test-true == true
        run: |
          echo 'hello world'

      #workflow_dispatch fails
      - name: test4
        if: inputs.test-true == 'true'
        run: |
          echo 'hello world'

      #workflow_dispatch works
      - name: test5
        if: ${{ github.event.inputs.test-true }}
        run: |
          echo 'hello world'

      #workflow_dispatch works
      - name: test6
        if: ${{ inputs.test-true }}
        run: |
          echo 'hello world'
