[project]
name = "fixture"
version = "0.0.0"
description = "Minimal package used by this repository's CI to exercise app-build-python.yml."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.13.6,<1"]
build-backend = "uv_build"

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
